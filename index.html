<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPSC PYQ Question Bank</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
        },
        startup: { typeset: false }
    };
</script>
<script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    /* LIGHT — warm "old paper" study palette, easy on the eyes */
    --bg: #F6EFDD;
    --bg-soft: #FBF6E9;
    --paper: #FFFDF6;
    --paper-alt: #FAF3E1;
    --ink: #2B2417;
    --ink-soft: #5B5240;
    --ink-faint: #8C816A;
    --rule: #E4D8B8;
    --rule-strong: #D6C79A;
    --accent: #9B5B2A;      /* burnt sienna — headings, active state */
    --accent-soft: #C98A4B;
    --accent-bg: #F1E2C4;
    --good: #3D7A4E;
    --good-bg: #E8F1E4;
    --good-border: #BEDCC0;
    --bad: #B54A3F;
    --bad-bg: #FBEAE6;
    --bad-border: #EFC5BC;
    --info: #3E6C8E;
    --info-bg: #E6EFF5;
    --info-border: #C2D9E8;
    --warn-bg: #FBEAE6;
    --warn-border: #EFC5BC;
    --warn-text: #93392E;
    --shadow: 0 1px 2px rgba(43,36,23,0.04), 0 3px 12px rgba(43,36,23,0.06);
    --shadow-hover: 0 2px 4px rgba(43,36,23,0.06), 0 10px 28px rgba(43,36,23,0.10);
}

html.dark {
    /* DARK — soft charcoal/sepia, not pure black, low eye strain at night */
    --bg: #1B1912;
    --bg-soft: #201D16;
    --paper: #23201A;
    --paper-alt: #29251D;
    --ink: #EDE6D6;
    --ink-soft: #C7BEA9;
    --ink-faint: #948A72;
    --rule: #3A362A;
    --rule-strong: #4A4536;
    --accent: #E3A15E;
    --accent-soft: #C98A4B;
    --accent-bg: #362B1C;
    --good: #7FBF8E;
    --good-bg: #20291F;
    --good-border: #35422F;
    --bad: #E28579;
    --bad-bg: #2C201D;
    --bad-border: #4A322B;
    --info: #8CB6D6;
    --info-bg: #1E2730;
    --info-border: #33455A;
    --warn-bg: #2C201D;
    --warn-border: #4A322B;
    --warn-text: #E8A69A;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 3px 14px rgba(0,0,0,0.30);
    --shadow-hover: 0 2px 6px rgba(0,0,0,0.28), 0 14px 32px rgba(0,0,0,0.40);
}

* { -webkit-tap-highlight-color: transparent; }

body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Serif', 'Noto Sans Devanagari', Georgia, serif;
    transition: background-color .25s ease, color .25s ease;
    min-height: 100vh;
}

.font-display { font-family: 'Fraunces', 'Noto Serif', serif; }
.font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

/* subtle paper grain */
.paper-texture {
    background-image:
        radial-gradient(circle at 1px 1px, rgba(43,36,23,0.035) 1px, transparent 0);
    background-size: 18px 18px;
}
html.dark .paper-texture {
    background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
}

.preserve-lines { white-space: pre-wrap; word-break: break-word; }
img { object-fit: contain; }

::selection { background: var(--accent-soft); color: #FFFDF6; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

/* Focus states — accessible */
button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* Loading skeleton shimmer */
@keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
}
.skeleton {
    background: linear-gradient(90deg, var(--paper-alt) 25%, var(--rule) 37%, var(--paper-alt) 63%);
    background-size: 800px 100%;
    animation: shimmer 1.6s linear infinite;
}

/* Card entrance */
@keyframes riseIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
.rise-in { animation: riseIn .35s ease both; }

@media (prefers-reduced-motion: reduce) {
    .rise-in, .skeleton { animation: none !important; }
    * { transition: none !important; }
}

/* Toggle switch */
.mode-switch {
    width: 52px; height: 28px;
    background: var(--paper-alt);
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
}
.mode-switch .knob {
    position: absolute; top: 2px; left: 2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    transition: transform .25s cubic-bezier(.4,0,.2,1), background .25s ease;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
}
html.dark .mode-switch .knob { transform: translateX(24px); }

/* Answer badge pulse on reveal */
@keyframes popIn {
    0% { transform: scale(.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
.pop-in { animation: popIn .25s cubic-bezier(.34,1.56,.64,1) both; }

.chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
}

.q-number-badge {
    font-family: 'Fraunces', serif;
    font-weight: 700;
}

.divider-rule {
    border-top: 1px dashed var(--rule-strong);
}

.searchbox {
    background: var(--paper);
    border: 1px solid var(--rule-strong);
}
.searchbox:focus-within {
    border-color: var(--accent);
}

.btn-primary {
    background: var(--accent);
    color: #FFFDF6;
}
.btn-primary:hover { background: var(--accent-soft); }

.btn-ghost {
    background: var(--paper-alt);
    border: 1px solid var(--rule-strong);
    color: var(--ink-soft);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

.jump-nav a {
    color: var(--ink-faint);
}
.jump-nav a:hover, .jump-nav a.active {
    color: var(--accent);
}

/* Sticky progress rail */
#progress-rail {
    position: fixed;
    top: 0; left: 0; height: 3px; width: 0%;
    background: var(--accent);
    z-index: 100;
    transition: width .1s linear;
}

.back-to-top {
    box-shadow: var(--shadow-hover);
}

@media print {
    header, #back-to-top, .no-print { display: none !important; }
    body { background: white; color: black; }
}
</style>
</head>
<body class="paper-texture">

<div id="progress-rail"></div>

<!-- ========================================================
     HEADER
========================================================= -->
<header class="sticky top-0 z-40 no-print" style="background: var(--paper); border-bottom: 1px solid var(--rule); box-shadow: var(--shadow);">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <button id="home-button" onclick="showHome()" class="hidden shrink-0 w-9 h-9 rounded-full items-center justify-center btn-ghost transition" aria-label="Back to all papers" title="All papers">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div class="min-w-0">
                    <h1 class="font-display text-lg sm:text-xl font-semibold leading-tight truncate" style="color: var(--ink);">RPSC PYQ Question Bank</h1>
                    <p id="page-subtitle" class="text-xs sm:text-sm truncate" style="color: var(--ink-faint);">Previous Year Questions</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <span id="question-count" class="hidden chip" style="background: var(--accent-bg); color: var(--accent);"></span>
                <div class="mode-switch" id="mode-toggle" onclick="toggleDarkMode()" role="button" tabindex="0" aria-label="Toggle dark mode" title="Toggle light / dark mode">
                    <div class="knob"><span id="mode-icon">☀️</span></div>
                </div>
            </div>
        </div>

        <div id="toolbar" class="hidden mt-3 flex flex-col sm:flex-row gap-2.5 sm:items-center">
            <div class="searchbox flex items-center gap-2 rounded-lg px-3 py-2 flex-grow transition">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--ink-faint); flex-shrink:0;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="search-input" oninput="onSearchInput()" type="text" placeholder="Search questions, topics, keywords…" class="bg-transparent outline-none text-sm w-full" style="color: var(--ink);">
                <button id="clear-search" onclick="clearSearch()" class="hidden text-xs shrink-0" style="color: var(--ink-faint);">Clear</button>
            </div>

            <div class="flex gap-2 items-center flex-wrap">
                <div id="language-buttons" class="flex p-1 rounded-lg text-xs font-semibold" style="background: var(--paper-alt); border: 1px solid var(--rule-strong);">
                    <button id="btn-hi" onclick="setLanguage('hi')" class="px-3 py-1.5 rounded-md transition">हिंदी</button>
                    <button id="btn-en" onclick="setLanguage('en')" class="px-3 py-1.5 rounded-md transition">English</button>
                    <button id="btn-both" onclick="setLanguage('both')" class="px-3 py-1.5 rounded-md transition">Both</button>
                </div>
                <select id="difficulty-filter" onchange="applyFilters()" class="text-xs font-semibold rounded-lg px-2.5 py-2 outline-none btn-ghost transition">
                    <option value="">All difficulty</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
                <button id="expand-all-btn" onclick="toggleExpandAll()" class="text-xs font-semibold rounded-lg px-3 py-2 btn-ghost transition">Expand all</button>
                <a id="review-link" href="review.html" class="text-xs font-semibold rounded-lg px-3 py-2 btn-ghost transition" style="text-decoration:none;" title="Review questions against the source page">📝 Review</a>
            </div>
        </div>
    </div>
</header>

<!-- ========================================================
     MAIN
========================================================= -->
<main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div id="loading" class="space-y-4">
        <div class="skeleton h-24 rounded-xl"></div>
        <div class="skeleton h-52 rounded-xl"></div>
        <div class="skeleton h-52 rounded-xl"></div>
    </div>
    <div id="content" class="hidden"></div>
    <div id="no-results" class="hidden text-center py-16">
        <p class="font-display text-lg" style="color: var(--ink-soft);">No questions match your search.</p>
        <button onclick="clearSearch()" class="mt-3 text-sm font-semibold underline" style="color: var(--accent);">Clear search</button>
    </div>
    <div id="error" class="hidden"></div>
</main>

<button id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})" class="no-print hidden fixed bottom-6 right-6 w-11 h-11 rounded-full items-center justify-center back-to-top z-40 transition" style="background: var(--accent); color: #fff;" aria-label="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
// ==========================================================
// STATE
// ==========================================================
let currentRun = null;
let currentQuestions = [];      // full set for the run
let filteredQuestions = [];     // after search/filter
let currentLanguage = "both";
let allExpanded = false;
let searchDebounce = null;

// ==========================================================
// DARK MODE
// ==========================================================
function applyModeFromStorage() {
    let mode;
    try { mode = localStorage.getItem('rpsc-theme'); } catch (e) { mode = null; }
    if (!mode) {
        mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    setMode(mode, false);
}
function setMode(mode, persist = true) {
    document.documentElement.classList.toggle('dark', mode === 'dark');
    document.getElementById('mode-icon').textContent = mode === 'dark' ? '🌙' : '☀️';
    if (persist) {
        try { localStorage.setItem('rpsc-theme', mode); } catch (e) {}
    }
}
function toggleDarkMode() {
    const isDark = document.documentElement.classList.contains('dark');
    setMode(isDark ? 'light' : 'dark');
}
document.getElementById('mode-toggle').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDarkMode(); }
});
applyModeFromStorage();

// ==========================================================
// UTILS
// ==========================================================
function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    const element = document.createElement("div");
    element.textContent = String(value);
    return element.innerHTML;
}
function formatText(text) {
    if (!text) return "";
    return escapeHtml(text).replace(/\n/g, "<br>");
}
function toggleAnalysis(id, btn) {
    const el = document.getElementById(id);
    const isHidden = el.classList.contains('hidden');
    el.classList.toggle('hidden');
    if (btn) btn.innerText = isHidden ? 'Hide solution & analysis' : 'View solution & analysis';
    if (isHidden) typesetMath();
}
function toggleExpandAll() {
    allExpanded = !allExpanded;
    document.querySelectorAll('[id^="analysis-"]').forEach(el => {
        el.classList.toggle('hidden', !allExpanded);
    });
    document.querySelectorAll('[data-analysis-toggle]').forEach(btn => {
        btn.innerText = allExpanded ? 'Hide solution & analysis' : 'View solution & analysis';
    });
    document.getElementById('expand-all-btn').innerText = allExpanded ? 'Collapse all' : 'Expand all';
    if (allExpanded) typesetMath();
}

// ==========================================================
// CLEANERS (Safe from truncating statements)
// ==========================================================
function cleanOptionText(text, label) {
    if (!text) return "";
    const escaped = String(label).replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`^\\s*(?:\\(${escaped}\\)|\\[${escaped}\\]|${escaped}\\.|${escaped}\\-|${escaped}\\))\\s*`, 'i');
    return text.replace(regex, '').trim();
}

function cleanQuestionText(text, options, lang) {
    if (!text || !Array.isArray(options) || options.length === 0) return text || "";

    let chopIndex = -1;

    // 1. Only chop if there is an explicit "Code -" or "कूट -" header followed immediately by options
    const codeMatch = text.match(/\n\s*(?:Code|कूट|Codes|कोड्स)\s*[-:]\s*\n\s*(?:\(1\)|\[1\]|1\.)/i);
    if (codeMatch) {
        return text.substring(0, codeMatch.index).trim();
    }

    // 2. Safely match exact option strings if they are duplicated at the bottom of the question text
    options.forEach(opt => {
        const label = String(opt.label).trim();
        let optText = opt[lang] ? String(opt[lang]).trim() : "";
        if (!optText || optText.length < 3) return;

        optText = cleanOptionText(optText, label);
        if (optText.length < 3) return;

        const escapedText = optText.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const pattern = new RegExp(`\\n\\s*(?:\\(${label}\\)|\\[${label}\\]|${label}\\.)\\s*${escapedText}`, 'i');
        const match = text.match(pattern);
        if (match && (chopIndex === -1 || match.index < chopIndex)) {
            chopIndex = match.index;
        }
    });

    if (chopIndex !== -1) {
        return text.substring(0, chopIndex).trim();
    }

    return text.trim();
}
// De-dupe safeguard: if, after cleaning, an option's text still appears
// verbatim inside the rendered options list more than once (rare malformed
// data), keep only the first occurrence per label so nothing double-renders.
function dedupeOptions(options) {
    if (!Array.isArray(options)) return [];
    const seen = new Set();
    const out = [];
    options.forEach(opt => {
        const key = String(opt.label) + '|' + (opt.hi || '') + '|' + (opt.en || '');
        if (seen.has(key)) return;
        seen.add(key);
        out.push(opt);
    });
    return out;
}

// ==========================================================
// LANGUAGE & MATHJAX
// ==========================================================
function setLanguage(language) {
    currentLanguage = language;
    ["hi", "en", "both"].forEach(btnLang => {
        const element = document.getElementById(`btn-${btnLang}`);
        if (!element) return;
        if (btnLang === language) {
            element.style.background = 'var(--paper)';
            element.style.color = 'var(--accent)';
            element.style.boxShadow = 'var(--shadow)';
        } else {
            element.style.background = 'transparent';
            element.style.color = 'var(--ink-faint)';
            element.style.boxShadow = 'none';
        }
    });
    document.querySelectorAll(".lang-hi").forEach(el => {
        el.classList.toggle("hidden", !(language === "hi" || language === "both"));
    });
    document.querySelectorAll(".lang-en").forEach(el => {
        el.classList.toggle("hidden", !(language === "en" || language === "both"));
    });
    try { localStorage.setItem('rpsc-lang', language); } catch (e) {}
    typesetMath();
}
async function typesetMath() {
    if (window.MathJax && typeof MathJax.typesetPromise === "function") {
        try { await MathJax.typesetPromise(); } catch (error) { console.warn("MathJax error:", error); }
    }
}
function assetUrl(runId, relativePath) {
    if (!relativePath) return "";
    return "output/" + encodeURIComponent(runId) + "/" + relativePath.split("/").map(part => encodeURIComponent(part)).join("/");
}

// ==========================================================
// VISUAL RENDERING (Tier-2 inline SVG, with graceful fallbacks)
// Priority per language: audited SVG > legacy per-language crop
// > full-block crop > image-gen-prompt placeholder note.
// Nothing here removes or changes the original image_hi/image_en
// rendering path — it's just tried first when no SVG exists yet.
// ==========================================================
function renderInlineSvg(svgMarkup) {
    if (!svgMarkup) return "";
    // Basic guard: only trust strings that actually look like SVG.
    const trimmed = svgMarkup.trim();
    if (!trimmed.startsWith("<svg")) return "";
    return `<div class="rounded-xl p-3 mx-auto" style="border: 1px solid var(--rule); background: #fff; max-width: 100%; overflow-x: auto;">${trimmed}</div>`;
}
function renderPromptPlaceholder(prompt) {
    if (!prompt) return "";
    return `
        <div class="rounded-xl p-3.5 text-sm flex gap-2.5" style="background: var(--info-bg); border: 1px solid var(--info-border); color: var(--info);">
            <span class="shrink-0">🎨</span>
            <div>
                <strong class="font-semibold block mb-0.5">Diagram pending generation</strong>
                <span style="color: var(--ink-soft);">${formatText(prompt)}</span>
            </div>
        </div>`;
}
function renderQuestionVisual(question, lang) {
    const svg = lang === "hi" ? question.svg_hi : question.svg_en;
    if (svg) return `<div class="mb-5">${renderInlineSvg(svg)}</div>`;

    const legacyImage = lang === "hi" ? question.image_hi : question.image_en;
    if (legacyImage) {
        return `<div class="mb-5"><img src="${assetUrl(currentRun, legacyImage)}" class="max-w-full max-h-[70vh] rounded-xl mx-auto" style="border: 1px solid var(--rule);"></div>`;
    }

    if (question.image_full) {
        return `<div class="mb-5"><img src="${assetUrl(currentRun, question.image_full)}" class="max-w-full max-h-[70vh] rounded-xl mx-auto" style="border: 1px solid var(--rule);"></div>`;
    }

    const prompt = lang === "hi" ? question.image_gen_prompt_hi : question.image_gen_prompt_en;
    if (prompt) return `<div class="mb-5">${renderPromptPlaceholder(prompt)}</div>`;

    return "";
}
function renderOptionVisual(option) {
    if (option.svg) return renderInlineSvg(option.svg);
    if (option.image) return `<div class="mb-2"><img src="${assetUrl(currentRun, option.image)}" class="max-w-full max-h-[40vh] rounded-xl mx-auto" style="border: 1px solid var(--rule);"></div>`;
    if (option.image_gen_prompt) return renderPromptPlaceholder(option.image_gen_prompt);
    return "";
}

// ==========================================================
// STRUCTURED CONTENT (content_hi / content_en block arrays)
// Written by review.html's "Structured (image/table)" editor —
// ordered text / image / table blocks, so an image or a table
// can sit at any position inside the statement instead of only
// before/after it. Falls back to the plain question_hi/en +
// legacy image slots wherever a question has no blocks.
// ==========================================================
function blocksToHtml(blocks, textClass, textStyle) {
    if (!Array.isArray(blocks)) return "";
    return blocks.map(b => {
        if (b.type === "text") {
            return b.text ? `<div class="${textClass} preserve-lines mb-4" style="${textStyle}">${formatText(b.text)}</div>` : "";
        }
        if (b.type === "image") {
            return `<div class="mb-5"><img src="${assetUrl(currentRun, b.path)}" class="max-w-full max-h-[70vh] rounded-xl mx-auto" style="border: 1px solid var(--rule);"></div>`;
        }
        if (b.type === "table") {
            const rows = b.rows || [];
            return `<div class="mb-5 overflow-x-auto"><table style="border-collapse:collapse; font-size:14px;">${rows.map((row, ri) => `<tr>${row.map(cell => (b.header && ri === 0) ? `<th style="border:1px solid var(--rule-strong); padding:6px 10px; background:var(--paper-alt); text-align:left;">${formatText(cell)}</th>` : `<td style="border:1px solid var(--rule-strong); padding:6px 10px;">${formatText(cell)}</td>`).join("")}</tr>`).join("")}</table></div>`;
        }
        return "";
    }).join("");
}

// ==========================================================
// LOAD DATA
// ==========================================================
async function loadCatalog() {
    const response = await fetch(`output/catalog.json?v=${new Date().getTime()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`Catalog HTTP ${response.status}`);
    return await response.json();
}
async function openRun(encodedRunId) {
    const runId = decodeURIComponent(encodedRunId);
    window.history.pushState({}, "", `?run=${encodeURIComponent(runId)}`);
    await loadRun(runId);
}
async function loadRun(runId) {
    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("content").classList.add("hidden");
    document.getElementById("no-results").classList.add("hidden");
    const response = await fetch(`output/${encodeURIComponent(runId)}/question_bank.json?v=${new Date().getTime()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`Question bank HTTP ${response.status}`);
    const data = await response.json();
    currentRun = runId;
    currentQuestions = Array.isArray(data.questions) ? data.questions : [];
    filteredQuestions = currentQuestions;
    renderQuestions();
    const reviewLink = document.getElementById("review-link");
    if (reviewLink) reviewLink.href = `review.html?run=${encodeURIComponent(runId)}`;
}

// ==========================================================
// SEARCH & FILTER
// ==========================================================
function onSearchInput() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(applyFilters, 180);
}
function clearSearch() {
    document.getElementById('search-input').value = '';
    applyFilters();
}
function applyFilters() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const diff = document.getElementById('difficulty-filter').value;
    document.getElementById('clear-search').classList.toggle('hidden', q.length === 0);

    filteredQuestions = currentQuestions.filter(question => {
        const meta = question.metadata || {};
        if (diff && meta.difficulty !== diff) return false;
        if (!q) return true;
        const haystack = [
            question.number, question.question_hi, question.question_en,
            meta.branch, meta.subtopic, meta.archetype,
            ...(Array.isArray(meta.keywords) ? meta.keywords : []),
            ...(Array.isArray(question.options) ? question.options.map(o => (o.hi||'') + ' ' + (o.en||'')) : [])
        ].join(' ').toLowerCase();
        return haystack.includes(q);
    });
    renderQuestionList();
}

// ==========================================================
// RENDERING — HOME
// ==========================================================
function renderHome(catalog) {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("home-button").classList.add("hidden");
    document.getElementById("toolbar").classList.add("hidden");
    document.getElementById("question-count").classList.add("hidden");
    document.getElementById("no-results").classList.add("hidden");
    document.getElementById("page-subtitle").innerText = "Select an examination paper";

    const content = document.getElementById("content");
    content.classList.remove("hidden");

    if (!catalog.runs || !catalog.runs.length) {
        content.innerHTML = `
            <div class="rounded-2xl p-12 text-center" style="background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow);">
                <h2 class="font-display text-xl font-semibold" style="color: var(--ink);">No question papers yet</h2>
                <p class="mt-2 text-sm" style="color: var(--ink-faint);">Run the processing workflow to generate your first RPSC paper.</p>
            </div>`;
        return;
    }

    let html = `
        <div class="mb-7">
            <h2 class="font-display text-2xl font-semibold" style="color: var(--ink);">Your Question Papers</h2>
            <p class="text-sm mt-1" style="color: var(--ink-faint);">${catalog.runs.length} paper(s) ready to study</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;

    catalog.runs.forEach((run, i) => {
        const name = escapeHtml(run.name);
        const questions = escapeHtml(run.question_count);
        const visual = escapeHtml(run.visual_question_count);
        const updated = run.updated_at ? new Date(run.updated_at).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'}) : "";
        html += `
            <button onclick="openRun('${encodeURIComponent(run.id)}')"
                class="rise-in text-left rounded-2xl p-5 sm:p-6 transition group"
                style="background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow); animation-delay: ${i * 40}ms;"
                onmouseover="this.style.boxShadow='var(--shadow-hover)'; this.style.borderColor='var(--accent-soft)';"
                onmouseout="this.style.boxShadow='var(--shadow)'; this.style.borderColor='var(--rule)';">
                <div class="flex justify-between items-start gap-3">
                    <h3 class="font-display text-lg font-semibold break-words leading-snug" style="color: var(--accent);">${name}</h3>
                    <span class="chip shrink-0" style="background: var(--accent-bg); color: var(--accent);">${questions} Q</span>
                </div>
                <div class="flex gap-4 text-xs mt-4 flex-wrap font-mono" style="color: var(--ink-faint);">
                    <span>🖼 ${visual} visual</span>
                </div>
                ${updated ? `<div class="text-xs mt-4 pt-3 divider-rule" style="color: var(--ink-faint);">Updated ${escapeHtml(updated)}</div>` : ""}
                <span onclick="event.stopPropagation(); location.href='review.html?run=${encodeURIComponent(run.id)}';" class="text-xs font-semibold underline mt-2 inline-block" style="color: var(--accent);">📝 Review this paper</span>
            </button>`;
    });
    html += `</div>`;
    content.innerHTML = html;
}

// ==========================================================
// RENDERING — QUESTION LIST (run view)
// ==========================================================
function renderQuestions() {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("home-button").classList.remove("hidden");
    document.getElementById("toolbar").classList.remove("hidden");

    let savedLang = 'both';
    try { savedLang = localStorage.getItem('rpsc-lang') || 'both'; } catch(e){}
    currentLanguage = savedLang;

    document.getElementById("page-subtitle").innerText = currentRun;
    document.getElementById("content").classList.remove("hidden");

    renderQuestionList();
    setLanguage(currentLanguage);
    buildJumpRail();
}

function renderQuestionList() {
    const count = document.getElementById("question-count");
    count.classList.remove("hidden");
    count.innerText = `${filteredQuestions.length} / ${currentQuestions.length} questions`;

    const content = document.getElementById("content");
    const noResults = document.getElementById("no-results");

    if (filteredQuestions.length === 0) {
        content.classList.add("hidden");
        noResults.classList.remove("hidden");
        return;
    }
    noResults.classList.add("hidden");
    content.classList.remove("hidden");

    let html = `
        <div class="rounded-2xl p-5 mb-7" style="background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow);">
            <h2 class="font-display text-xl font-semibold" style="color: var(--ink);">${escapeHtml(currentRun)}</h2>
            <p class="text-sm mt-1" style="color: var(--ink-faint);">${filteredQuestions.length} question(s) shown</p>
        </div>`;
    filteredQuestions.forEach((q, i) => { html += renderQuestion(q, i); });
    content.innerHTML = html;
    setLanguage(currentLanguage);

    if (allExpanded) {
        document.querySelectorAll('[id^="analysis-"]').forEach(el => el.classList.remove('hidden'));
        document.querySelectorAll('[data-analysis-toggle]').forEach(btn => btn.innerText = 'Hide solution & analysis');
    }
}

function renderQuestion(question, idx) {
    const number = escapeHtml(question.number);
    const meta = question.metadata || {};
    const options = dedupeOptions(question.options);

    const hiStructured = Array.isArray(question.content_hi) && question.content_hi.length > 0;
    const enStructured = Array.isArray(question.content_en) && question.content_en.length > 0;

    // Structured content (tables / inline images built in review.html)
    // is human-curated already, so it's rendered as-is rather than run
    // through the OCR-cleanup pass below.
    const cleanHi = hiStructured ? "" : cleanQuestionText(question.question_hi, options, 'hi');
    const cleanEn = enStructured ? "" : cleanQuestionText(question.question_en, options, 'en');

    let diffStyle = "background: var(--paper-alt); color: var(--ink-soft); border: 1px solid var(--rule-strong);";
    if (meta.difficulty === "Easy")   diffStyle = "background: var(--good-bg); color: var(--good); border: 1px solid var(--good-border);";
    if (meta.difficulty === "Medium") diffStyle = "background: var(--accent-bg); color: var(--accent); border: 1px solid var(--rule-strong);";
    if (meta.difficulty === "Hard")   diffStyle = "background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-border);";

    let html = `
        <article id="q-${number}" class="rise-in rounded-2xl p-5 md:p-6 mb-6 scroll-mt-24" style="background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow); animation-delay: ${Math.min(idx,10) * 30}ms;">

            <div class="pb-4 mb-5 divider-rule flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex items-center gap-3">
                    <span class="q-number-badge flex items-center justify-center w-10 h-10 rounded-full text-sm shrink-0" style="background: var(--accent); color: #FFFDF6;">${number}</span>
                    <span class="text-sm font-medium" style="color: var(--ink-faint);">${escapeHtml(meta.branch || 'Unknown')} <span style="color: var(--rule-strong);">›</span> ${escapeHtml(meta.subtopic || 'General')}</span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                    <span class="chip" style="${diffStyle}">${escapeHtml(meta.difficulty || 'N/A')}</span>
                    <span class="chip" style="background: var(--info-bg); color: var(--info); border:1px solid var(--info-border);">${escapeHtml(meta.blooms_level || 'N/A')}</span>
                    <span class="chip" style="background: var(--paper-alt); color: var(--ink-soft); border:1px solid var(--rule-strong);">⏱ ${escapeHtml(meta.estimated_seconds || '0')}s</span>
                    ${question.audited ? `<span class="chip" style="background: var(--good-bg); color: var(--good); border:1px solid var(--good-border);">✓ Reviewed</span>` : ''}
                </div>
            </div>`;

    if (meta.has_translation_discrepancy) {
        html += `
            <div class="rounded-xl p-3.5 text-sm mb-5 flex gap-2.5" style="background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);">
                <span class="shrink-0">⚠️</span>
                <div>
                    <strong class="font-semibold block mb-0.5">Translation discrepancy</strong>
                    <span>${formatText(meta.discrepancy_note || 'The Hindi and English versions of this question contain differing information.')}</span>
                </div>
            </div>`;
    }

    if (hiStructured) {
        html += `<div class="lang-hi">${blocksToHtml(question.content_hi, "text-lg font-medium leading-relaxed", "color: var(--ink);")}</div>`;
    } else {
        if (cleanHi) html += `<div class="lang-hi text-lg font-medium leading-relaxed preserve-lines mb-4" style="color: var(--ink);">${formatText(cleanHi)}</div>`;
        html += `<div class="lang-hi">${renderQuestionVisual(question, 'hi')}</div>`;
    }

    if (enStructured) {
        html += `<div class="lang-en ${(hiStructured || cleanHi) ? 'pt-4 divider-rule' : ''}">${blocksToHtml(question.content_en, "text-base leading-relaxed", "color: var(--ink-soft);")}</div>`;
    } else {
        if (cleanEn) html += `<div class="lang-en text-base leading-relaxed preserve-lines ${cleanHi ? 'pt-4 divider-rule' : ''} mb-4" style="color: var(--ink-soft);">${formatText(cleanEn)}</div>`;
        html += `<div class="lang-en">${renderQuestionVisual(question, 'en')}</div>`;
    }

    // OPTIONS
    html += `<div class="mt-5 space-y-2.5">`;
    options.forEach(opt => {
        html += `
            <div class="flex items-start rounded-xl p-3" style="background: var(--paper-alt); border: 1px solid var(--rule);">
                <span class="font-mono font-bold w-8 flex-shrink-0 text-sm pt-0.5" style="color: var(--ink-faint);">(${escapeHtml(opt.label)})</span>
                <div class="flex-grow flex flex-col gap-1.5 min-w-0">`;
        if (opt.hi) html += `<div class="lang-hi text-sm preserve-lines" style="color: var(--ink);">${formatText(cleanOptionText(opt.hi, opt.label))}</div>`;
        if (opt.en) html += `<div class="lang-en text-sm preserve-lines ${opt.hi ? 'pt-1.5 divider-rule' : ''}" style="color: var(--ink-soft);">${formatText(cleanOptionText(opt.en, opt.label))}</div>`;        const optionVisual = renderOptionVisual(opt);
        if (optionVisual) html += `<div class="mt-2">${optionVisual}</div>`;
        html += `</div></div>`;
    });
    html += `</div>`;

    // ANALYSIS TOGGLE
    const analysisId = `analysis-${number}`;
    html += `
        <div class="mt-5 pt-4 divider-rule">
            <button data-analysis-toggle onclick="toggleAnalysis('${analysisId}', this)" class="w-full py-2.5 font-semibold rounded-xl transition flex justify-center items-center gap-2 text-sm" style="background: var(--accent-bg); color: var(--accent); border: 1px solid var(--rule-strong);">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>
                View solution & analysis
            </button>
        </div>`;

    html += `<div id="${analysisId}" class="hidden mt-5 pt-5 space-y-6" style="border-top: 2px solid var(--rule);">`;

    // EXPLANATION
    html += `
        <div>
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2.5 font-mono" style="color: var(--ink-faint);">Step-by-step solution</h3>
            <div class="rounded-xl p-4" style="background: var(--good-bg); border: 1px solid var(--good-border); color: var(--ink);">
                ${question.explanation_hi ? `<div class="lang-hi preserve-lines text-sm">${formatText(question.explanation_hi)}</div>` : ''}
                ${question.explanation_en ? `<div class="lang-en preserve-lines text-sm ${question.explanation_hi ? 'mt-3 pt-3 divider-rule' : ''}">${formatText(question.explanation_en)}</div>` : ''}
            </div>
        </div>`;

    // RATIONALES
    if (Array.isArray(question.option_rationales) && question.option_rationales.length) {
        html += `<div><h3 class="text-xs font-bold uppercase tracking-wider mb-2.5 font-mono" style="color: var(--ink-faint);">Option analysis</h3><div class="grid gap-2.5">`;
        question.option_rationales.forEach(rat => {
            const isCorrect = rat.is_correct;
            const style = isCorrect
                ? "background: var(--good-bg); border: 1px solid var(--good-border);"
                : "background: var(--paper-alt); border: 1px solid var(--rule);";
            const labelColor = isCorrect ? "color: var(--good);" : "color: var(--ink-faint);";
            const icon = isCorrect ? "✅" : "✕";
            html += `
                <div class="flex items-start rounded-xl p-3 ${isCorrect ? 'pop-in' : ''}" style="${style}">
                    <span class="w-8 font-bold flex-shrink-0 text-sm pt-0.5 font-mono" style="${labelColor}">${icon}</span>
                    <div class="flex-grow flex flex-col gap-1 text-sm min-w-0" style="color: var(--ink-soft);">
                        ${rat.rationale_hi ? `<div class="lang-hi preserve-lines">${formatText(rat.rationale_hi)}</div>` : ''}
                        ${rat.rationale_en ? `<div class="lang-en preserve-lines ${rat.rationale_hi ? 'pt-1 mt-1 divider-rule' : ''}">${formatText(rat.rationale_en)}</div>` : ''}
                    </div>
                </div>`;
        });
        html += `</div></div>`;
    }

    // INSIGHTS
    const hasTrap = meta.conceptual_trap_hi || meta.conceptual_trap_en;
    const hasHack = meta.shortcut_hack_hi || meta.shortcut_hack_en;
    const hasFacts = meta.ncert_mapping || meta.prerequisite_topic || meta.formula_law_dependency;

    if (hasTrap || hasHack || hasFacts) {
        html += `<h3 class="text-xs font-bold uppercase tracking-wider font-mono" style="color: var(--ink-faint);">Pedagogical insights</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
        if (hasTrap) {
            html += `
                <div class="rounded-xl p-4" style="background: var(--bad-bg); border: 1px solid var(--bad-border);">
                    <strong class="text-xs uppercase tracking-wider mb-2 block font-mono" style="color: var(--bad);">Conceptual trap</strong>
                    <div class="text-sm" style="color: var(--ink);">
                        ${meta.conceptual_trap_hi ? `<div class="lang-hi">${formatText(meta.conceptual_trap_hi)}</div>` : ''}
                        ${meta.conceptual_trap_en ? `<div class="lang-en ${meta.conceptual_trap_hi ? 'mt-2 pt-2 divider-rule' : ''}">${formatText(meta.conceptual_trap_en)}</div>` : ''}
                    </div>
                </div>`;
        }
        if (hasHack) {
            html += `
                <div class="rounded-xl p-4" style="background: var(--info-bg); border: 1px solid var(--info-border);">
                    <strong class="text-xs uppercase tracking-wider mb-2 block font-mono" style="color: var(--info);">Shortcut / hack</strong>
                    <div class="text-sm" style="color: var(--ink);">
                        ${meta.shortcut_hack_hi ? `<div class="lang-hi">${formatText(meta.shortcut_hack_hi)}</div>` : ''}
                        ${meta.shortcut_hack_en ? `<div class="lang-en ${meta.shortcut_hack_hi ? 'mt-2 pt-2 divider-rule' : ''}">${formatText(meta.shortcut_hack_en)}</div>` : ''}
                    </div>
                </div>`;
        }
        if (hasFacts) {
            html += `
                <div class="rounded-xl p-4 md:col-span-2 grid grid-cols-1 sm:grid-cols-3 gap-4" style="background: var(--paper-alt); border: 1px solid var(--rule);">
                    ${meta.ncert_mapping ? `<div><strong class="text-xs uppercase block mb-1 font-mono" style="color: var(--ink-faint);">NCERT mapping</strong><span class="text-sm font-medium" style="color: var(--ink);">${formatText(meta.ncert_mapping)}</span></div>` : ''}
                    ${meta.formula_law_dependency ? `<div><strong class="text-xs uppercase block mb-1 font-mono" style="color: var(--ink-faint);">Core formula / law</strong><span class="text-sm font-medium" style="color: var(--ink);">${formatText(meta.formula_law_dependency)}</span></div>` : ''}
                    ${meta.prerequisite_topic ? `<div><strong class="text-xs uppercase block mb-1 font-mono" style="color: var(--ink-faint);">Prerequisite topic</strong><span class="text-sm font-medium" style="color: var(--ink);">${formatText(meta.prerequisite_topic)}</span></div>` : ''}
                </div>`;
        }
        html += `</div>`;
    }

    // CLONE VARIANT
    if (meta.clone_variant && Array.isArray(meta.clone_variant.options) && meta.clone_variant.options.length) {
        const cv = meta.clone_variant;
        html += `
            <div class="rounded-xl p-5 relative overflow-hidden" style="background: var(--info-bg); border: 2px solid var(--info-border);">
                <div class="absolute top-0 right-0 text-[10px] font-bold px-3 py-1 rounded-bl-lg uppercase tracking-wider font-mono" style="background: var(--info); color: #FFFDF6;">Practice clone</div>
                <h3 class="text-sm font-bold mb-3" style="color: var(--info);">Test your understanding</h3>
                ${cv.question_hi ? `<div class="lang-hi text-sm font-medium mb-2.5 preserve-lines" style="color: var(--ink);">${formatText(cv.question_hi)}</div>` : ''}
                ${cv.question_en ? `<div class="lang-en text-sm mb-4 preserve-lines" style="color: var(--ink-soft);">${formatText(cv.question_en)}</div>` : ''}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">`;
        cv.options.forEach(opt => {
            const isAns = opt.label === cv.correct_label;
            html += `
                <div class="p-2.5 rounded-lg flex gap-2" style="background: var(--paper); ${isAns ? 'border: 1.5px solid var(--good);' : 'border: 1px solid var(--rule);'}">
                    <span class="font-bold font-mono text-sm" style="color: ${isAns ? 'var(--good)' : 'var(--ink-faint)'};">(${escapeHtml(opt.label)})</span>
                    <div class="text-sm">
                        ${opt.hi ? `<div class="lang-hi" style="color: var(--ink);">${formatText(opt.hi)}</div>` : ''}
                        ${opt.en ? `<div class="lang-en" style="color: var(--ink-faint);">${formatText(opt.en)}</div>` : ''}
                    </div>
                </div>`;
        });
        html += `</div>
                <div class="text-sm p-3.5 rounded-lg" style="background: var(--paper); border: 1px solid var(--info-border); color: var(--ink-soft);">
                    <strong style="color: var(--info);">Solution:</strong> ${formatText(cv.explanation_en)}
                </div>
            </div>`;
    }

    // KEYWORDS
    if (Array.isArray(meta.keywords) && meta.keywords.length > 0) {
        html += `<div class="flex flex-wrap gap-1.5 pt-4" style="border-top: 1px dashed var(--rule-strong);">`;
        meta.keywords.forEach(kw => {
            html += `<span class="chip font-normal" style="background: var(--paper-alt); color: var(--ink-faint); border:1px solid var(--rule);">#${escapeHtml(kw)}</span>`;
        });
        html += `</div>`;
    }

    html += `</div></article>`;
    return html;
}

// ==========================================================
// NAV / SCROLL HELPERS
// ==========================================================
function buildJumpRail() {}

function showHome() {
    currentRun = null;
    currentQuestions = [];
    filteredQuestions = [];
    window.history.pushState({}, "", window.location.pathname);
    loadCatalog().then(renderHome).catch(showError);
}

function showError(error) {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("content").classList.add("hidden");
    const errorElement = document.getElementById("error");
    errorElement.classList.remove("hidden");
    errorElement.innerHTML = `
        <div class="rounded-2xl p-8 text-center" style="background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad);">
            <h2 class="font-display font-semibold text-lg">Could not load question bank</h2>
            <p class="mt-2 text-sm">${escapeHtml(error.message)}</p>
        </div>`;
}

// Progress rail + back-to-top visibility
window.addEventListener('scroll', () => {
    const doc = document.documentElement;
    const scrolled = doc.scrollTop;
    const height = doc.scrollHeight - doc.clientHeight;
    const pct = height > 0 ? (scrolled / height) * 100 : 0;
    document.getElementById('progress-rail').style.width = pct + '%';
    document.getElementById('back-to-top').classList.toggle('hidden', scrolled < 400);
    document.getElementById('back-to-top').classList.toggle('flex', scrolled >= 400);
});

async function init() {
    try {
        const catalog = await loadCatalog();
        const parameters = new URLSearchParams(window.location.search);
        const run = parameters.get("run");
        if (run) await loadRun(run);
        else renderHome(catalog);
    } catch (error) { showError(error); }
}

window.onpopstate = () => { init(); };
init();
</script>
