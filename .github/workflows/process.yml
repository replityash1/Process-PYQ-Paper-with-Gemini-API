name: Automated RPSC Drive Pipeline

on:

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write


# ============================================================
# PREP
# ============================================================

jobs:

  prep:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_file: ${{ steps.check.outputs.has_file }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils jq


      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth \
            pillow


      - name: Fetch latest PDF from Drive
        id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

        run: |

          python3 scripts/drive_sync.py fetch

          if [ -f "input/exam_paper.pdf" ]; then

            echo "has_file=true" >> "$GITHUB_OUTPUT"

          else

            echo "has_file=false" >> "$GITHUB_OUTPUT"

          fi


      - name: Generate page matrix
        id: matrix

        if: steps.check.outputs.has_file == 'true'

        run: |

          PAGE_COUNT=$(
            pdfinfo input/exam_paper.pdf |
            awk '/^Pages:/ {print $2}'
          )

          echo "Total pages: $PAGE_COUNT"

          MATRIX=$(
            seq 1 "$PAGE_COUNT" |
            jq -R . |
            jq -s -c 'map(tonumber)'
          )

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"


      - name: Upload source PDF
        if: steps.check.outputs.has_file == 'true'

        uses: actions/upload-artifact@v4

        with:
          name: source-pdf

          path: |
            input/exam_paper.pdf
            .drive_file_info

          retention-days: 1


# ============================================================
# PROCESS EACH PAGE
# ============================================================

  process:

    needs: prep

    if: needs.prep.outputs.has_file == 'true'

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      max-parallel: 5

      matrix:
        page: ${{ fromJson(needs.prep.outputs.matrix) }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils


      - name: Install Python dependencies
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-genai \
            pydantic \
            pillow


      - name: Download source PDF
        uses: actions/download-artifact@v4

        with:
          name: source-pdf
          path: input/


      - name: Prepare directories
        run: |
          mkdir -p pages
          mkdir -p output_temp


      - name: Restore Drive metadata
        run: |

          if [ -f "input/.drive_file_info" ]; then
            cp input/.drive_file_info .
          fi


      - name: Render page
        run: |

          echo "Rendering page ${{ matrix.page }}"

          pdftoppm \
            -f ${{ matrix.page }} \
            -l ${{ matrix.page }} \
            -singlefile \
            -jpeg \
            -r 200 \
            input/exam_paper.pdf \
            pages/page_${{ matrix.page }}

          ls -lh \
            pages/page_${{ matrix.page }}.jpg


      - name: Extract questions with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python3 \
            scripts/extract_api.py \
            ${{ matrix.page }}


      - name: Upload page output
        uses: actions/upload-artifact@v4

        with:
          name: output-page-${{ matrix.page }}

          path: output_temp/

          retention-days: 1


# ============================================================
# MERGE EVERYTHING
# ============================================================

  merge:

    needs: process

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Drive dependencies
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth


      - name: Download all page artifacts
        uses: actions/download-artifact@v4

        with:
          path: downloaded_outputs


      - name: Inspect downloaded artifacts
        run: |

          echo "Downloaded files:"

          find downloaded_outputs \
            -type f |
            sort


      - name: Restore Drive metadata
        run: |

          DRIVE_INFO=$(
            find downloaded_outputs \
              -type f \
              -name ".drive_file_info" \
              -print \
              -quit
          )

          if [ -n "$DRIVE_INFO" ]; then

            cp "$DRIVE_INFO" .

            echo "Drive metadata restored."

          else

            echo "WARNING: Drive metadata not found."

          fi


      - name: Merge question bank
        run: |

          python3 \
            scripts/merge_jsons.py


      - name: Archive processed PDF
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

        run: |

          python3 \
            scripts/drive_sync.py \
            archive


      - name: Commit generated database
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then

            echo "No output changes."

          else

            git commit \
              -m "AI: Process RPSC exam paper"

            git pull \
              --rebase \
              origin main

            git push

          fi
