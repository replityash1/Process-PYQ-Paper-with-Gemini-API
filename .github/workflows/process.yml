name: Automated RPSC Drive Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write


# ============================================================
# PREP JOB
# ============================================================

jobs:

  prep:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_file: ${{ steps.check.outputs.has_file }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # System dependencies
      # --------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            jq


      # --------------------------------------------------------
      # Python dependencies
      # --------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth \
            pillow


      # --------------------------------------------------------
      # Fetch PDF from Google Drive
      # --------------------------------------------------------

      - name: Check Drive and fetch PDF
        id: check

        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

        run: |

          python3 scripts/drive_sync.py fetch

          if [ -f "input/exam_paper.pdf" ]; then

            echo "has_file=true" >> "$GITHUB_OUTPUT"

            echo "PDF successfully downloaded."

          else

            echo "has_file=false" >> "$GITHUB_OUTPUT"

            echo "No PDF available."

          fi


      # --------------------------------------------------------
      # Generate page matrix
      # --------------------------------------------------------

      - name: Generate page matrix
        id: matrix

        if: steps.check.outputs.has_file == 'true'

        run: |

          PAGE_COUNT=$(
            pdfinfo input/exam_paper.pdf |
            awk '/^Pages:/ {print $2}'
          )

          if [ -z "$PAGE_COUNT" ]; then
            echo "ERROR: Could not determine PDF page count."
            exit 1
          fi

          echo "PDF page count: $PAGE_COUNT"

          MATRIX=$(
            seq 1 "$PAGE_COUNT" |
            jq -R . |
            jq -s -c 'map(tonumber)'
          )

          echo "Generated matrix:"
          echo "$MATRIX"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Verify source files before artifact upload
      # --------------------------------------------------------

      - name: Verify source files
        if: steps.check.outputs.has_file == 'true'

        run: |

          echo "Checking source files..."

          if [ ! -f "input/exam_paper.pdf" ]; then
            echo "ERROR: input/exam_paper.pdf is missing."
            exit 1
          fi

          if [ ! -f "input/.drive_file_info" ]; then
            echo "ERROR: input/.drive_file_info is missing."
            exit 1
          fi

          echo "PDF:"
          ls -lh input/exam_paper.pdf

          echo ""
          echo "Drive metadata:"
          cat input/.drive_file_info

          echo ""
          echo "Source files verified."


      # --------------------------------------------------------
      # Upload source files
      #
      # Uploading the input/ directory explicitly packages
      # the PDF and tracking file together perfectly.
      # --------------------------------------------------------

      - name: Upload source files
        if: steps.check.outputs.has_file == 'true'

        uses: actions/upload-artifact@v4

        with:
          name: source-pdf
          path: input/
          retention-days: 1


  # ============================================================
  # PROCESS JOB
  # One worker per PDF page
  # ============================================================

  process:

    needs: prep

    if: needs.prep.outputs.has_file == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        page: ${{ fromJson(needs.prep.outputs.matrix) }}


    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # System dependencies
      # --------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils


      # --------------------------------------------------------
      # Python dependencies
      # --------------------------------------------------------

      - name: Install Python dependencies
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-genai \
            pydantic \
            pillow


      # --------------------------------------------------------
      # Download source artifact
      # --------------------------------------------------------

      - name: Download source files
        uses: actions/download-artifact@v4

        with:
          name: source-pdf
          path: input/


      # --------------------------------------------------------
      # Verify artifact structure
      # --------------------------------------------------------

      - name: Verify downloaded source files
        run: |

          echo "Current working directory:"
          pwd

          echo ""
          echo "Relevant files:"
          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "exam_paper.pdf" \
              -o \
              -name ".drive_file_info" \
            \) \
            -print \
            | sort

          echo ""

          if [ ! -f "input/exam_paper.pdf" ]; then

            echo "ERROR:"
            echo "input/exam_paper.pdf was not found."

            echo ""
            echo "Full input directory:"
            find input \
              -maxdepth 3 \
              -type f \
              -print \
              2>/dev/null \
              | sort || true

            echo ""
            echo "Repository files:"
            find . \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1

          fi


          if [ ! -f "input/.drive_file_info" ]; then

            echo "ERROR:"
            echo "input/.drive_file_info was not found."

            echo ""
            echo "Repository files:"
            find . \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1

          fi


          echo "Source PDF:"
          ls -lh input/exam_paper.pdf

          echo ""
          echo "Drive metadata:"
          cat input/.drive_file_info

          echo ""
          echo "Source files verified successfully."


      # --------------------------------------------------------
      # Prepare temporary directories
      # --------------------------------------------------------

      - name: Prepare processing directories
        run: |

          mkdir -p pages
          mkdir -p output_temp

          echo "Directories prepared."


      # --------------------------------------------------------
      # Render one page from PDF
      # --------------------------------------------------------

      - name: Render page
        run: |

          echo "======================================"
          echo "RENDERING PAGE ${{ matrix.page }}"
          echo "======================================"

          pdftoppm \
            -f ${{ matrix.page }} \
            -l ${{ matrix.page }} \
            -singlefile \
            -jpeg \
            -r 200 \
            input/exam_paper.pdf \
            pages/page_${{ matrix.page }}


          if [ ! -f "pages/page_${{ matrix.page }}.jpg" ]; then

            echo "ERROR:"
            echo "Page image was not created."

            exit 1

          fi


          echo ""
          echo "Rendered page image:"

          ls -lh \
            pages/page_${{ matrix.page }}.jpg


      # --------------------------------------------------------
      # Gemini extraction
      # --------------------------------------------------------

      - name: Extract questions with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          echo "======================================"
          echo "GEMINI EXTRACTION"
          echo "PAGE: ${{ matrix.page }}"
          echo "======================================"

          python3 \
            scripts/extract_api.py \
            ${{ matrix.page }}


      # --------------------------------------------------------
      # Verify page output before uploading artifact
      # --------------------------------------------------------

      - name: Verify page output
        run: |

          echo "Generated output files:"

          find output_temp \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          if [ ! -f \
            "output_temp/page_${{ matrix.page }}.json"
          ]; then

            echo "ERROR:"
            echo "Expected page JSON was not generated."

            exit 1

          fi


          echo ""
          echo "Page output verified."


      # --------------------------------------------------------
      # Upload page result
      # --------------------------------------------------------

      - name: Upload page output
        uses: actions/upload-artifact@v4

        with:
          name: output-page-${{ matrix.page }}

          path: output_temp/

          retention-days: 1


  # ============================================================
  # MERGE JOB
  # ============================================================

  merge:

    needs: process

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Drive dependencies
      # --------------------------------------------------------

      - name: Install Drive dependencies
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth


      # --------------------------------------------------------
      # Download ALL page artifacts
      # --------------------------------------------------------

      - name: Download all page outputs
        uses: actions/download-artifact@v4

        with:
          path: downloaded_outputs


      # --------------------------------------------------------
      # Inspect downloaded artifacts
      # --------------------------------------------------------

      - name: Verify downloaded page outputs
        run: |

          echo "======================================"
          echo "DOWNLOADED ARTIFACTS"
          echo "======================================"

          if [ ! -d "downloaded_outputs" ]; then

            echo "ERROR: downloaded_outputs does not exist."

            exit 1

          fi


          find downloaded_outputs \
            -type f \
            -print \
            | sort


          JSON_COUNT=$(
            find downloaded_outputs \
              -type f \
              -name "*.json" \
              ! -name "*_raw.json" \
              | wc -l
          )


          echo ""
          echo "JSON files found: $JSON_COUNT"


          if [ "$JSON_COUNT" -eq 0 ]; then

            echo "ERROR:"
            echo "No page JSON files were downloaded."

            exit 1

          fi


      # --------------------------------------------------------
      # Restore Drive metadata into input/
      # --------------------------------------------------------

      - name: Restore Drive metadata
        run: |

          DRIVE_INFO=$(
            find downloaded_outputs \
              -type f \
              -name ".drive_file_info" \
              -print \
              -quit
          )


          if [ -n "$DRIVE_INFO" ]; then

            echo "Found Drive metadata:"
            echo "$DRIVE_INFO"
            
            mkdir -p input
            cp "$DRIVE_INFO" input/

            echo ""
            echo "Restored input/.drive_file_info"

            cat input/.drive_file_info

          else

            echo "ERROR:"
            echo ".drive_file_info was not found."

            exit 1

          fi


      # --------------------------------------------------------
      # Merge questions
      # --------------------------------------------------------

      - name: Merge question bank
        run: |

          echo "======================================"
          echo "MERGING QUESTION BANK"
          echo "======================================"

          python3 \
            scripts/merge_jsons.py


      # --------------------------------------------------------
      # Verify final output
      # --------------------------------------------------------

      - name: Verify final output
        run: |

          echo "======================================"
          echo "FINAL OUTPUT"
          echo "======================================"

          find output \
            -maxdepth 4 \
            -type f \
            -print \
            | sort


          if [ ! -f "output/catalog.json" ]; then

            echo "ERROR:"
            echo "output/catalog.json was not created."

            exit 1

          fi


          echo ""
          echo "Catalog verified."


      # --------------------------------------------------------
      # Archive processed PDF in Google Drive
      # --------------------------------------------------------

      - name: Archive processed PDF
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

        run: |

          echo "Archiving processed PDF..."

          python3 \
            scripts/drive_sync.py \
            archive


      # --------------------------------------------------------
      # Commit result
      # --------------------------------------------------------

      - name: Commit generated question bank
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add output/


          if git diff --cached --quiet; then

            echo "No generated output changes."

          else

            echo "Generated output changed."

            git commit \
              -m "AI: Process RPSC exam paper"


            git pull \
              --rebase \
              origin main


            git push

            echo "Changes pushed successfully."

          fi
